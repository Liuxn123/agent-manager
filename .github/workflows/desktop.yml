name: Desktop CI and packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15, macos-15-intel]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install Qt system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0
      - name: Install
        run: python -m pip install -e ".[build]" -r requirements-build.txt
      - name: Compile and test
        run: |
          python -m compileall -q src scripts
          python -m unittest discover -s tests -v
      - name: Build
        run: python scripts/build.py
      - name: Validate frozen package
        run: python scripts/smoke_package.py
      - uses: actions/upload-artifact@v7
        with:
          name: AgentManager-${{ matrix.os }}
          path: |
            dist/AgentManager-*.zip
            dist/AgentManager-*.tar.gz
            build/smoke.png
          if-no-files-found: error
          retention-days: 14
