[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agent-manager"
version = "0.1.0"
description = "Cross-platform personal Hermes, project and agent management desktop"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "cryptography>=44", "keyring>=25"]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]

[project.scripts]
agent-manager = "agent_manager.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_manager = ["assets/fonts/*.otf", "assets/fonts/*.txt", "assets/fonts/*.md"]
